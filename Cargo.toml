[package]
name = "rmkit"
version = "0.1.1"
edition = "2021"
repository = "https://github.com/rmk-rs/rmkit"
resolver = "2"
description = "rmkit is a toolkit set for RMK keyboard firmware"
license = "Apache-2.0"

[dependencies]
rmk-config = "0.8.0"
rynk-kle = "0.3.0"
clap = { version = "4.5.23", features = ["derive", "string"] }
toml = "1"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "gzip", "stream", "rustls"] }
tokio = { version = "1", features = ["full"] }
zip = "9"
futures = "0.3"
futures-util = "0.3.31"
walkdir = "2"
inquire = "0.9"
cargo_toml = "1"
cargo_metadata = "0.23"

[profile.release]
codegen-units = 1
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
