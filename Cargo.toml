[package]
name = "rmkit"
version = "0.1.0"
edition = "2021"
homepage = "https://github.com/rmk-rs/rmkit"
repository = "https://github.com/rmk-rs/rmkit"
resolver = "2"
description = "rmkit is a toolkit set for RMK keyboard firmware"
license = "Apache-2.0"

[dependencies]
# Pins the `keyboard.toml` schema; `deny_unknown_fields` rejects keys added later.
# Tracks rmk `main` between releases — move back to crates.io before publishing.
rmk-config = { git = "https://github.com/rmk-rs/rmk", rev = "5f06e5bfda227df7240d8ad148f704bb27667f0d" }
# The KLE/Vial ↔ [layout] engine behind `rmkit layout`. It pins rmk-config
# exactly, so both deps must point at the same source.
rynk-kle = { git = "https://github.com/rmk-rs/rmk", rev = "5f06e5bfda227df7240d8ad148f704bb27667f0d" }
clap = { version = "4.5.23", features = ["derive", "string"] }
toml = "0.9.8"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "gzip", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
zip = "4"
futures = "0.3"
futures-util = "0.3.31"
walkdir = "2"
inquire = "0.7.5"
cargo_toml = "0.22"
cargo_metadata = "0.20"

[profile.release]
codegen-units = 1
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
