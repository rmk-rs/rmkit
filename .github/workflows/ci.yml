name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: build
        run: cargo build --locked

      - name: test
        run: cargo test --locked

      - name: Smoke-test the bundled keyboard.toml
        run: |
          set -euo pipefail
          test "$(cargo run --quiet -- get-chip --keyboard-toml-path keyboard.toml)" = "nrf52840"
          test "$(cargo run --quiet -- get-project-name --keyboard-toml-path keyboard.toml)" = "RMK_Keyboard"

  publishable:
    name: publishable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A git dependency blocks `cargo publish`, but the rev pin is deliberate
      # between RMK releases (see Cargo.toml), so only fail on release tags.
      - name: Check for git dependencies
        id: git_deps
        run: |
          if grep -q 'source = "git+' Cargo.lock; then
            grep -n 'source = "git+' Cargo.lock
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Cargo.lock contains a git dependency; rmkit cannot be published."
              exit 1
            fi
            echo "::warning::Cargo.lock contains a git dependency; switch back to crates.io before releasing."
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo publish --dry-run
        if: steps.git_deps.outputs.present != 'true'
        run: cargo publish --dry-run --locked
